<!doctype html>
<!--
  Source for public/og-2.png, the image shown when the site is shared on
  LinkedIn, WhatsApp and similar. Everything sits in the centre square,
  because WhatsApp crops the image towards a square from the centre.

  To regenerate after a change, screenshot this page at exactly 1200 x 630:
    chrome --headless=new --hide-scrollbars --window-size=1200,630 \
      --screenshot=public/og-2.png scripts/og-image.html
  When the image changes, also change its file name (og-3.png, ...) and the
  path in src/layouts/Base.astro, so apps fetch the new one instead of a
  cached copy.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Bricolage Grotesque Variable";
    font-weight: 200 800;
    font-stretch: 75% 100%;
    src: url("../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-standard-normal.woff2") format("woff2-variations");
  }
  html, body { margin: 0; width: 1200px; height: 630px; }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0E1B2E;
    color: #FFFFFF;
    font-family: "Bricolage Grotesque Variable", "Segoe UI", sans-serif;
    text-align: center;
  }
  .name { font-size: 104px; font-weight: 650; font-stretch: 87%; letter-spacing: -0.035em; line-height: 0.95; }
  .role { margin-top: 26px; font-size: 34px; font-weight: 550; font-stretch: 92%; line-height: 1.25; }
  .role span { display: block; }
  .bar { width: 72px; height: 7px; margin: 26px 0 22px; background: #FF6B1A; border-radius: 4px; }
  .years { font-size: 26px; font-weight: 500; color: #AEBBD0; }
</style>
</head>
<body>
  <div class="name">Vinay<br>Purohit</div>
  <div class="role"><span>Software Engineer</span><span>Full-Stack, Backend &amp; AI/GenAI</span></div>
  <div class="bar"></div>
  <div class="years">Nearly 3 years of experience</div>
</body>
</html>
